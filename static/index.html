<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complaint Desk</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Complaint Desk <span>support tickets</span></div>
    <div class="top-actions">
      <span class="who" id="who"></span>
      <button class="btn ghost hidden" id="logout">Log out</button>
    </div>
  </header>

  <main class="wrap">
    <section class="card" id="auth-card">
      <h1>Sign in</h1>
      <p class="sub">Track complaints, assign priority, and keep a status history.</p>
      <div class="tabs">
        <button class="on" id="tab-login" type="button">Login</button>
        <button id="tab-register" type="button">Register</button>
      </div>
      <form id="auth-form">
        <label>Username</label>
        <input id="username" autocomplete="username" required>
        <label>Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <div class="err" id="auth-err"></div>
        <button class="btn block" id="auth-submit" type="submit">Login</button>
      </form>
    </section>

    <section class="grid hidden" id="desk">
      <form class="card" id="create-form">
        <h2>New complaint</h2>
        <label>Title</label>
        <input id="title" required maxlength="120">
        <label>Description</label>
        <textarea id="description" required maxlength="2000"></textarea>
        <label>Priority</label>
        <select id="priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <div class="err" id="create-err"></div>
        <button class="btn block" type="submit">Create ticket</button>
      </form>

      <section class="card">
        <h2>Open desk</h2>
        <div id="list"></div>
      </section>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
